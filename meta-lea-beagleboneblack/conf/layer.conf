# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-lea-beagleboneblack"
BBFILE_PATTERN_meta-lea-beagleboneblack = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-lea-beagleboneblack = "6"

LAYER_VERSION_meta-lea-beagleboneblack = "1"
LAYERSERIES_COMPAT_meta-lea-beagleboneblack = "scarthgap"
