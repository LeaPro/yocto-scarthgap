# Kernel config fragment for u-blox MAYA-W271 WiFi + BT on BeagleBone Black
#
# WiFi: NXP moal/mlan out-of-tree driver (IW612 / SD9177) — built separately.
#        Disable in-kernel mwifiex so it doesn't claim device 0x0471:0x0205.
# BT:   hci_uart with H4 protocol (serdev-based HCI UART)
#
# H4 must be built-in (=y) as it's selected by BT_HCIUART.

CONFIG_MWIFIEX=n
CONFIG_MWIFIEX_SDIO=n
CONFIG_BT_HCIUART=m
CONFIG_BT_HCIUART_H4=y
CONFIG_BT_NXPUART=m
CONFIG_SND_SOC_TI_EDMA_PCM=m
CONFIG_SND_SOC_DAVINCI_MCASP=m
CONFIG_SND_SIMPLE_CARD=m
CONFIG_SND_SOC_PCM5102A=m
