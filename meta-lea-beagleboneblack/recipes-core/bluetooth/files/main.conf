[General]
# 0 = discoverable forever (never auto-expire).
DiscoverableTimeout = 0
# 0 = pairable forever (never auto-expire).
PairableTimeout = 0
# Keep the controller on classic Bluetooth for the audio sink use case.
ControllerMode = bredr

[Policy]
# Automatically power on Bluetooth adapter at bluetoothd startup.
# Needed for NXP IW612: ensures hci0 is brought up before the chip
# enters BT power save and becomes unresponsive to hciconfig hci0 up.
AutoEnable=true
# Allow already-paired phones to reconnect without a new pairing dialog.
JustWorksRepairing = always

[GATT]
DisableLE=true
