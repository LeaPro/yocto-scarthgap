# Deterministic ALSA names for unified 8-channel Remy DSP link.
# Channels 1/2 = BT, 3/4 = NET, 5/6 = AUX1, 7/8 = AUX2.

pcm.remy_8ch_hw {
    type hw
    card "REMY8CH"
    device 0
}

ctl.remy_8ch_hw {
    type hw
    card "REMY8CH"
}

pcm.remy_8ch_48k {
    type rate
    slave {
        pcm "remy_8ch_hw"
        rate 48000
        format S16_LE
    }
    converter "speexrate_medium"
}

pcm.remy_bt_route {
    type route
    slave {
        pcm "remy_8ch_48k"
        channels 8
    }
    ttable.0.0 1
    ttable.1.1 1
}

pcm.remy_net_route {
    type route
    slave {
        pcm "remy_8ch_48k"
        channels 8
    }
    ttable.0.2 1
    ttable.1.3 1
}

pcm.remy_aux1_route {
    type route
    slave {
        pcm "remy_8ch_48k"
        channels 8
    }
    ttable.0.4 1
    ttable.1.5 1
}

pcm.remy_aux2_route {
    type route
    slave {
        pcm "remy_8ch_48k"
        channels 8
    }
    ttable.0.6 1
    ttable.1.7 1
}

pcm.bt_audio {
    type plug
    slave.pcm "remy_bt_route"
    hint {
        show on
        description "Remy BT audio endpoint (DSP ch1/ch2)"
    }
}

pcm.net_audio_core {
    type plug
    slave.pcm "remy_net_route"
}

pcm.net_audio {
    type softvol
    slave.pcm "net_audio_core"
    control {
        name "NetAudio Playback Volume"
        card "REMY8CH"
    }
    min_dB -51.0
    max_dB 0.0
    resolution 128
    hint {
        show on
        description "Remy network audio endpoint (DSP ch3/ch4)"
    }
}

pcm.aux1_audio {
    type plug
    slave.pcm "remy_aux1_route"
    hint {
        show on
        description "Remy AUX1 audio endpoint (DSP ch5/ch6)"
    }
}

pcm.aux2_audio {
    type plug
    slave.pcm "remy_aux2_route"
    hint {
        show on
        description "Remy AUX2 audio endpoint (DSP ch7/ch8)"
    }
}

ctl.bt_audio {
    type hw
    card "REMY8CH"
}

ctl.net_audio {
    type hw
    card "REMY8CH"
}

ctl.aux1_audio {
    type hw
    card "REMY8CH"
}

ctl.aux2_audio {
    type hw
    card "REMY8CH"
}

pcm.!default {
    type plug
    slave.pcm "net_audio"
}

ctl.!default {
    type hw
    card "REMY8CH"
}
