#@TYPE: Machine
#@NAME: LEA Trevally (BeaglePlay-derived)
#@DESCRIPTION: Custom AM62x machine configuration based on BeaglePlay

require conf/machine/beagleplay.conf

# Use BeagleBoard.org kernel provider (same as BeaglePlay)
PREFERRED_PROVIDER_virtual/kernel = "linux-bb.org"

# Device tree for custom board (override BeaglePlay BSP lists)
KERNEL_DEVICETREE = "ti/am62x-lea-trevally.dtb"
KERNEL_DEVICETREE:bsp-bb_org-6_12 = "ti/am62x-lea-trevally.dtb"
KERNEL_DEVICETREE:bsp-bb_org-6_6 = "ti/am62x-lea-trevally.dtb"

# Do not stage bootloader binaries into images
IMAGE_BOOT_FILES = ""

# Only produce tar.xz (no wic)
IMAGE_FSTYPES = "tar.xz"



# Disable R5 multiconfig since U-Boot is built separately
BBMULTICONFIG = ""
do_image[mcdepends] = ""

# Remove bootloader dependencies since U-Boot is built separately
EXTRA_IMAGEDEPENDS:remove = "virtual/bootloader"
# Use BeagleBoard.org U-Boot when it is needed (e.g., for u-boot-fw-utils)
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-bb.org"
PREFERRED_PROVIDER_u-boot = "u-boot-bb.org"
# Satisfy kernel provider checks
UBOOT_MACHINE = "am62x_beagleplay_a53_defconfig"

# Override these for your custom board
#
# Console (adjust UART if different)
# SERIAL_CONSOLES = "115200;ttyS2"
#
# Optional: add/trim machine features
# MACHINE_FEATURES:append = " "
