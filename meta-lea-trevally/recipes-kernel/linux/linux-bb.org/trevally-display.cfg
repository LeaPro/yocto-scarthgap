# Core Display Subsystem (AM62x DSS)
CONFIG_DRM=y
CONFIG_DRM_KMS_HELPER=y
CONFIG_DRM_TIDSS=y

# Core Panel Framework
CONFIG_DRM_PANEL=y
CONFIG_DRM_PANEL_SIMPLE=y
CONFIG_DRM_PANEL_DPI=y

# Custom DRM Panel Driver (from patch 0003)
CONFIG_DRM_PANEL_DMT049W1NTCMI=y

# Sitronix Touchscreen Driver (from patch 0004)
CONFIG_INPUT=y
CONFIG_INPUT_TOUCHSCREEN=y
CONFIG_TOUCHSCREEN_SITRONIX_TS=y

# PWM Subsystem (Required for EHRPWM0_A backlight control)
CONFIG_PWM=y
CONFIG_PWM_TI_ECAP=y
CONFIG_PWM_TI_EPWM=y

# Backlight Drivers
CONFIG_BACKLIGHT_LCD_SUPPORT=y
CONFIG_BACKLIGHT_CLASS_DEVICE=y
CONFIG_BACKLIGHT_PWM=y
CONFIG_BACKLIGHT_GPIO=y

# Bus Support for Panel SPI Init & Touch Control
CONFIG_SPI=y
CONFIG_SPI_MASTER=y
CONFIG_SPI_OMAP24XX=y
CONFIG_I2C=y
CONFIG_I2C_CHARDEV=y

# Sitronix Touchscreen Support (Patch 0004)
CONFIG_INPUT=y
CONFIG_INPUT_TOUCHSCREEN=y
CONFIG_TOUCHSCREEN_SITRONIX_TS=y